# tmux settings that make thumbmux feel right. Loaded by the server at start
# (set THUMBMUX_TMUX_CONF to use your own file instead).

# Swipe / wheel scroll the terminal (the page forwards touch as wheel events)
set -g mouse on
set -g history-limit 50000
# One line per wheel tick instead of 5: a finger swipe sends many ticks.
bind -T copy-mode    WheelUpPane   send-keys -X -N 1 scroll-up
bind -T copy-mode    WheelDownPane send-keys -X -N 1 scroll-down
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down

# Snappy keys and full key passthrough for modern TUIs (Claude Code, Codex, ...)
set -sg escape-time 0
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g set-clipboard off
# Focus events make TUIs repaint on every tab switch - not wanted here.
set -g focus-events off

# Colors
set -g default-terminal tmux-256color
set -ga terminal-overrides ',xterm*:RGB,smcup@:rmcup@'

# The web page draws its own tab bar
set -g status off
# Resize to the most recently active client
set -g window-size latest
set -gw aggressive-resize off
